name: int1433-training-platform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER:?GHCR_OWNER is required}/int1433-backend:${APP_VERSION:?APP_VERSION is required}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    ports:
      - "${CHALLENGE_TCP_PORT_MIN:-19000}-${CHALLENGE_TCP_PORT_MAX:-19020}:${CHALLENGE_TCP_PORT_MIN:-19000}-${CHALLENGE_TCP_PORT_MAX:-19020}/tcp"
      - "${CHALLENGE_UDP_PORT_MIN:-19100}-${CHALLENGE_UDP_PORT_MAX:-19120}:${CHALLENGE_UDP_PORT_MIN:-19100}-${CHALLENGE_UDP_PORT_MAX:-19120}/udp"
      - "${RMI_REGISTRY_PORT:-19200}:${RMI_REGISTRY_PORT:-19200}/tcp"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CHALLENGE_HOST: ${CHALLENGE_BIND_HOST:-0.0.0.0}
      CHALLENGE_BIND_ADDRESS: ${CHALLENGE_BIND_HOST:-0.0.0.0}
      CHALLENGE_PUBLIC_HOST: ${CHALLENGE_PUBLIC_HOST:?CHALLENGE_PUBLIC_HOST is required}
      CHALLENGE_TCP_PORT_MIN: ${CHALLENGE_TCP_PORT_MIN:-19000}
      CHALLENGE_TCP_PORT_MAX: ${CHALLENGE_TCP_PORT_MAX:-19020}
      CHALLENGE_UDP_PORT_MIN: ${CHALLENGE_UDP_PORT_MIN:-19100}
      CHALLENGE_UDP_PORT_MAX: ${CHALLENGE_UDP_PORT_MAX:-19120}
      RMI_REGISTRY_PORT: ${RMI_REGISTRY_PORT:-19200}
      RMI_PUBLIC_HOST: ${RMI_PUBLIC_HOST:?RMI_PUBLIC_HOST is required}
      SOAP_PORT: ${SERVER_PORT:-8080}
      MAX_ACTIVE_SESSIONS_PER_PARTICIPANT: ${MAX_ACTIVE_SESSIONS_PER_PARTICIPANT:-3}
      MAX_GLOBAL_ACTIVE_SESSIONS: ${MAX_GLOBAL_ACTIVE_SESSIONS:-20}
      JAVA_RUNNER_IMAGE: ${JAVA_RUNNER_IMAGE:?JAVA_RUNNER_IMAGE is required}
      JAVA_RUNNER_WORKSPACE_ROOT: ${JAVA_RUNNER_WORKSPACE_ROOT:-/var/lib/int1433/runner-workspaces}
      JAVA_RUNNER_MAX_CONCURRENT: ${JAVA_RUNNER_MAX_CONCURRENT:-3}
      JAVA_RUNNER_MEMORY_MB: ${JAVA_RUNNER_MEMORY_MB:-256}
      JAVA_RUNNER_PIDS_LIMIT: ${JAVA_RUNNER_PIDS_LIMIT:-32}
      JAVA_RUNNER_CPUS: ${JAVA_RUNNER_CPUS:-1.0}
      JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:--Xms256m -Xmx1024m} -Djava.rmi.server.hostname=${RMI_PUBLIC_HOST:?RMI_PUBLIC_HOST is required}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${JAVA_RUNNER_WORKSPACE_ROOT:-/var/lib/int1433/runner-workspaces}:${JAVA_RUNNER_WORKSPACE_ROOT:-/var/lib/int1433/runner-workspaces}
    group_add:
      - "${DOCKER_GID:?DOCKER_GID is required}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${SERVER_PORT}/actuator/health >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 512
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

  web:
    image: ${GHCR_REGISTRY:-ghcr.io}/${GHCR_OWNER:?GHCR_OWNER is required}/int1433-web:${APP_VERSION:?APP_VERSION is required}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 128
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_data:
