name: Publish Images

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      # actions/setup-java v4.7.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: npm ci
      - run: npm run validate
      - run: npm run content:check
      - run: npm run starters:check
      - run: npm run frontend:build
      - run: docker build -t int1433-java-runner:0.4.1 runner
      - run: ./backend/mvnw test
      - name: Verify release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/verify-release-version.mjs "${GITHUB_REF_NAME}"
      - name: Render production Compose
        run: |
          cp deploy/.env.prod.example deploy/.env.prod
          sed -i 's/GHCR_OWNER=replace-with-lowercase-owner/GHCR_OWNER=example-owner/' deploy/.env.prod
          sed -i 's/POSTGRES_PASSWORD=replace-with-long-random-secret/POSTGRES_PASSWORD=example-secret-not-for-production/' deploy/.env.prod
          sed -i 's/DOCKER_GID=replace-with-docker-socket-gid/DOCKER_GID=999/' deploy/.env.prod
          sed -i 's|JAVA_RUNNER_IMAGE=ghcr.io/replace-owner/int1433-java-runner:0.4.1|JAVA_RUNNER_IMAGE=ghcr.io/example-owner/int1433-java-runner:0.4.1|' deploy/.env.prod
          docker compose --env-file deploy/.env.prod -f deploy/docker-compose.prod.yml config >/tmp/int1433-compose.yml
          grep -q '19000-19020' /tmp/int1433-compose.yml
          grep -q '19100-19120' /tmp/int1433-compose.yml
          grep -q '19200' /tmp/int1433-compose.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: int1433-backend
            dockerfile: backend/Dockerfile
            context: .
            title: INT1433 Training Platform Backend
            cache: backend
          - name: int1433-web
            dockerfile: web/Dockerfile
            context: .
            title: INT1433 Training Platform Web
            cache: web
          - name: int1433-java-runner
            dockerfile: runner/Dockerfile
            context: runner
            title: INT1433 Java Runner
            cache: runner
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Lowercase owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Image version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=main" >> "$GITHUB_OUTPUT"
          fi
      # docker/setup-buildx-action v3.11.1
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      # docker/login-action v3.5.0
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # docker/metadata-action v5.8.0
      - id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f
        with:
          images: ghcr.io/${{ steps.owner.outputs.owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=INT1433 Training Platform production image
            org.opencontainers.image.licenses=MIT
      - name: Build and push ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,scope=${{ matrix.cache }},mode=max
          provenance: true
          sbom: true
      # actions/attest-build-provenance v2.4.0
      - name: Attest image provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-name: ghcr.io/${{ steps.owner.outputs.owner }}/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
