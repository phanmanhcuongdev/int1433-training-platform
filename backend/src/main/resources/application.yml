server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: int1433-training-platform
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:int1433}
    username: ${DB_USER:int1433}
    password: ${DB_PASSWORD:int1433_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
